name: SonarCloud Scan

on:
  push:
    branches: [ main ]   # run when you push to main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (skip if not JS)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Build (optional)
        run: |
          if [ -f package.json ]; then npm run build || true; fi

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.projectKey=Muhammad-Miqdad-Ahmad_Weather-app
            -Dsonar.organization=muhammad-miqdad-ahmad
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

